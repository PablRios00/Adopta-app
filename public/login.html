<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Adopciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/estilos.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 22rem;">
      <h3 class="text-center mb-3 titulo-principal">Iniciar sesión</h3>

      <form id="formLogin">
        <div class="form-group mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" name="usuario" required />
        </div>

        <div class="form-group mb-4">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" name="contrasena" required />
        </div>

        <button type="submit" class="btn btn-principal w-100 mb-3">Entrar</button>
        <div id="mensaje" class="text-center text-danger" style="min-height:1.5em;"></div>

        <div class="text-center">
          <small class="text-muted">¿Aún no tienes cuenta?</small><br />
          <a href="registro.html" class="btn btn-outline-principal btn-sm mt-2 w-100">Crear cuenta nueva</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const mensaje = document.getElementById("mensaje");

      try {
        const res = await fetch("php/login.php", { method: "POST", body: formData });
        const texto = await res.text();

        // Si PHP redirige, este fetch no lo sigue, así que controlamos manualmente:
        if (res.redirected) {
          window.location.href = res.url;
          return;
        }

        if (texto.trim() === "success") {
          window.location.href = "index.html";
        } else {
          mensaje.textContent = texto;
        }
      } catch (err) {
        mensaje.textContent = "Error de conexión.";
      }
    });
  </script>
</body>
</html>
