<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil | Adopta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="/adopciones/assets/estilos.css" />
  <link rel="stylesheet" href="/adopciones/assets/perfil-layout.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar-adopciones">
    <a class="navbar-brand" href="index.html">
      <img src="/adopciones/assets/logo.png" alt="Logo" />
      <span>Adopta</span>
    </a>
    <div class="nav-icons">
      <i class="bi bi-heart-fill nav-item-icon"
         onclick="window.location.href='favoritos.html'" title="Favoritos"></i>
      <i class="bi bi-envelope-fill nav-item-icon"
         onclick="window.location.href='mensajes.html'" title="Buzón"></i>
      <span id="nombreUsuarioNav" class="navbar-usuario"
            onclick="window.location.href='perfil.html'"></span>
    </div>
  </nav>

  <div class="perfil-wrapper">
    <aside class="perfil-sidebar">
      <img id="avatarSidebar" src="/adopciones/assets/avatar-default.png" alt="Avatar" class="sidebar-avatar" />
      <p class="sidebar-nombre" id="sidebarNombre">Cargando...</p>
      <a href="perfil.html"        class="sidebar-btn activo"><i class="bi bi-person-circle"></i> Perfil</a>
      <a href="publicaciones.html" class="sidebar-btn"><i class="bi bi-card-image"></i> Tus publicaciones</a>
      <a href="favoritos.html"     class="sidebar-btn"><i class="bi bi-heart-fill"></i> Mis favoritos</a>
      <a href="mensajes.html"      class="sidebar-btn"><i class="bi bi-chat-dots-fill"></i> Bandeja de mensajes</a>
      <div class="sidebar-divider"></div>
      <button class="sidebar-btn btn-cerrar-sesion" id="btnCerrarSesion">
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
      </button>
    </aside>

    <main class="perfil-contenido">
      <h4 class="panel-titulo"><i class="bi bi-person-circle me-2"></i>Mi perfil</h4>
      <div class="row g-4">
        <div class="col-md-4 text-center">
          <img id="avatarPerfil" src="/adopciones/assets/avatar-default.png"
               class="rounded-circle border mb-3"
               style="width:120px;height:120px;object-fit:cover;border-color:var(--color-principal)!important" />
          <div>
            <label for="inputFotoPerfil" class="btn btn-sm btn-outline-secondary" style="cursor:pointer;">
              <i class="bi bi-camera"></i> Cambiar foto
            </label>
            <input type="file" id="inputFotoPerfil" name="fotoPerfil"
                   accept="image/*" class="d-none"
                   onchange="previewFoto(this)" />
          </div>
        </div>
        <div class="col-md-8">
          <form id="formEditarPerfil" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Nombre de usuario</label>
              <input type="text" id="editNombre" name="nombreUsuario" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" id="editEmail" name="emailUsuario" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="text" id="editTelefono" name="telefonoUsuario" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" id="editDireccion" name="direccionUsuario" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Nueva contraseña
                <small class="text-muted">(dejar en blanco para no cambiar)</small>
              </label>
              <input type="password" id="editContrasena" name="contrasenaUsuario" class="form-control" />
            </div>
            <div id="msgPerfil" class="text-center mb-2" style="min-height:1.4em;font-size:0.9rem;"></div>
            <button type="submit" class="btn btn-principal w-100">
              <i class="bi bi-floppy2-fill me-1"></i> Guardar cambios
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/adopciones/assets/perfil-common.js"></script>
  <script>
    function previewFoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById("avatarPerfil").src  = e.target.result;
          document.getElementById("avatarSidebar").src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function cargarDatosPerfil() {
      try {
        const res  = await fetch("/adopciones/php/obtenerPerfil.php");
        const data = await res.json();
        document.getElementById("editNombre").value    = data.nombreUsuario    || "";
        document.getElementById("editEmail").value     = data.emailUsuario     || "";
        document.getElementById("editTelefono").value  = data.telefonoUsuario  || "";
        document.getElementById("editDireccion").value = data.direccionUsuario || "";

        if (parseInt(data.tieneFoto) === 1) {
          const src = `/adopciones/php/verFotoPerfil.php?id=${data.idUsuario}&t=${Date.now()}`;
          document.getElementById("avatarPerfil").src  = src;
          document.getElementById("avatarSidebar").src = src;
        }
      } catch {
        console.warn("No se pudieron cargar los datos del perfil.");
      }
    }

    document.getElementById("formEditarPerfil").addEventListener("submit", async e => {
      e.preventDefault();
      const msg   = document.getElementById("msgPerfil");
      const datos = new FormData(e.target);
      const fotoInput = document.getElementById("inputFotoPerfil");
      if (fotoInput.files[0]) datos.set("fotoPerfil", fotoInput.files[0]);

      try {
        const res   = await fetch("/adopciones/php/editarPerfil.php", { method: "POST", body: datos });
        const texto = await res.text();
        if (texto.trim() === "success") {
          msg.className   = "text-success text-center mb-2";
          msg.textContent = "✅ Cambios guardados correctamente.";
          document.getElementById("sidebarNombre").textContent    = document.getElementById("editNombre").value;
          document.getElementById("nombreUsuarioNav").textContent = document.getElementById("editNombre").value;
        } else {
          msg.className   = "text-danger text-center mb-2";
          msg.textContent = texto;
        }
      } catch {
        msg.className   = "text-danger text-center mb-2";
        msg.textContent = "Error al conectar con el servidor.";
      }
    });

    inicializar();
    cargarDatosPerfil();
  </script>
</body>
</html>
