<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta property="og:title" content="Adopta 🐾 | Encuentra tu compañero ideal" />
  <meta property="og:description" content="Plataforma web full-stack para adopción responsable de animales, con geolocalización real, alertas automáticas y chat entre usuarios." />
  <meta property="og:image" content="https://adopta.pablorios.eu/assets/logo.png" />
  <meta property="og:url" content="https://adopta.pablorios.eu" />
  <meta property="og:type" content="website" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mascota | Adopta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/estilos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    .nav-icon-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 1.5rem;
      cursor: pointer;
    }
    .nav-icon-wrapper .nav-item-icon { margin-left: 0; }
    .badge-mensajes {
      position: absolute;
      top: -6px; right: -8px;
      background: #e74c3c;
      color: #fff;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    /* ── Ficha responsive ── */
    @media (max-width: 767px) {
      .ficha-col-foto { margin-bottom: 1.5rem; }
      .btn-chat { font-size: 0.9rem; padding: 0.6rem 1rem; }
      .descripcion-box { padding: 1rem 1.1rem; font-size: 0.92rem; }
      .lugar-box { font-size: 0.9rem; }
    }
  </style>
</head>

<body>
  <nav class="navbar-adopciones">
    <a class="navbar-brand" href="index.html">
      <img src="assets/logo.png" alt="Logo" />
      <span>Adopta</span>
    </a>
    <div class="nav-icons">
      <div class="nav-icon-wrapper" id="btnNavFav" title="Favoritos"
           onclick="accionProtegida('favoritos.html')">
        <i class="bi bi-heart-fill nav-item-icon"></i>
      </div>
      <div class="nav-icon-wrapper" id="btnNavMsg" title="Buzón"
           onclick="accionProtegida('mensajes.html')">
        <i class="bi bi-envelope-fill nav-item-icon"></i>
        <span class="badge-mensajes d-none" id="badgeMensajes"></span>
      </div>
      <span id="nombreUsuarioNav" class="navbar-usuario"
            onclick="accionProtegida('perfil.html')" title="Ver mi perfil"></span>
    </div>
  </nav>

  <main class="container my-4 my-md-5" id="contenidoMascota">
    <p class="text-center text-muted">Cargando...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    let _logueado  = false;
    let _usuarioId = null;

    function accionProtegida(destino) {
      if (!_logueado) {
        window.location.href = "login.html";
        return false;
      }
      if (destino) window.location.href = destino;
      return true;
    }

    function formatFecha(f) {
      if (!f) return "";
      const partes = String(f).slice(0, 10).split("-");
      if (partes.length !== 3) return f;
      const [y, mes, d] = partes;
      return `${d}/${mes}/${y.slice(2)}`;
    }

    async function cargarBadgeMensajes() {
      try {
        const res   = await fetch("php/contarMensajesNoLeidos.php");
        const data  = await res.json();
        const badge = document.getElementById("badgeMensajes");
        if (data.noLeidos > 0) {
          badge.textContent = data.noLeidos > 9 ? "9+" : data.noLeidos;
          badge.classList.remove("d-none");
        }
      } catch { /* silencioso */ }
    }

    const params    = new URLSearchParams(window.location.search);
    const idMascota = parseInt(params.get("id"));
    if (!idMascota) window.location.href = "index.html";

    let fotosDisponibles = [];
    let fotoActual       = 0;

    async function inicializar() {
      try {
        const res  = await fetch("php/index.php");
        const data = await res.json();
        _logueado  = data.logueado === true;
        _usuarioId = data.id;

        const spanNombre = document.getElementById("nombreUsuarioNav");
        if (_logueado) {
          spanNombre.textContent = data.usuario;
          cargarBadgeMensajes();
        } else {
          spanNombre.innerHTML = '<i class="bi bi-person-circle"></i>';
        }
      } catch { /* silencioso */ }
    }

    async function cargarMascota() {
      try {
        const res = await fetch(`php/obtenerMascota.php?id=${idMascota}`);
        const m   = await res.json();
        if (m.error) { window.location.href = "index.html"; return; }

        let esFav = false;
        if (_logueado) {
          const favRes  = await fetch(`php/esFavorito.php?id=${idMascota}`);
          const favData = await favRes.json();
          esFav = favData.favorito === true;
        }

        const edad   = m.edadMascota ? `${m.edadMascota} año${m.edadMascota == 1 ? "" : "s"}` : "Desconocida";
        const badgeC = m.estadoAdopcionMascota === "En adopción" ? "bg-success"
                     : m.estadoAdopcionMascota === "Perdido"     ? "bg-warning text-dark"
                     : "bg-danger";

        const inicialPub   = (m.nombrePublicador || '?')[0].toUpperCase();
        const tieneFotoPub = parseInt(m.tieneFotoPublicador) === 1;
        const avatarPub    = tieneFotoPub
          ? `<img src="php/verFotoPerfil.php?id=${m.idUsuarioFK1}"
                  alt="${m.nombrePublicador}"
                  style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid #d0e4f5;" />`
          : `<span class="avatar-inicial">${inicialPub}</span>`;

        document.getElementById("contenidoMascota").innerHTML = `
          <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-arrow-left"></i> Volver
            </a>
          </div>

          <div class="row g-4">
            <div class="col-12 col-md-5 ficha-col-foto">
              <div class="foto-wrapper" id="fotoWrapper">
                <img id="fotoPrincipal"
                     src="php/verImagen.php?id=${m.idMascota}"
                     alt="${m.nombreMascota}"
                     onerror="this.src='assets/no-imagen.png'" />
                <button class="btn-favorito" id="btnFavorito"
                        onclick="gestionarFavorito()"
                        title="${esFav ? "Quitar de favoritos" : "Añadir a favoritos"}">
                  <i class="bi ${esFav ? "bi-heart-fill" : "bi-heart"}"></i>
                </button>
                <button class="btn-foto-nav izq d-none" id="btnIzq" onclick="cambiarFoto(-1)">
                  <i class="bi bi-chevron-left"></i>
                </button>
                <button class="btn-foto-nav der d-none" id="btnDer" onclick="cambiarFoto(1)">
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>

              <div class="fotos-miniaturas" id="fotosMiniaturas"></div>

              <div class="mt-3">
                <button class="btn-chat w-100 justify-content-center"
                        onclick="gestionarChat(${m.idUsuarioFK1})">
                  <i class="bi bi-envelope-fill"></i> Contactar por chat
                </button>
              </div>
            </div>

            <div class="col-12 col-md-7">
              <div class="d-flex align-items-center gap-3 mb-2 flex-wrap">
                <h1 class="ficha-titulo mb-0">${m.nombreMascota}</h1>
                <span class="badge ${badgeC} badge-estado">${m.estadoAdopcionMascota}</span>
              </div>

              <p class="publicado-por mb-3">
                <i class="bi bi-calendar3 me-1"></i>
                Publicado el ${formatFecha(m.fechaPublicacionMascota)}
              </p>

              <div class="descripcion-box mb-4">
                ${m.descripcionMascota || "Sin descripción."}
              </div>

              <h6 class="fw-semibold mb-2" style="color:var(--color-principal-oscuro);">
                <i class="bi bi-info-circle me-1"></i> Especificaciones
              </h6>
              <div class="spec-grid mb-4">
                <div class="spec-item">
                  <span class="spec-label">Especie</span>
                  <span class="spec-valor">${m.especieMascota || "—"}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Sexo</span>
                  <span class="spec-valor">${m.sexoMascota || "—"}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Edad</span>
                  <span class="spec-valor">${edad}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Raza</span>
                  <span class="spec-valor">${m.razaMascota || "—"}</span>
                </div>
              </div>

              <div class="lugar-box mb-3">
                <i class="bi bi-geo-alt-fill text-danger fs-5"></i>
                <span>${m.lugarMascota || "Ubicación no especificada"}</span>
              </div>

              <div class="pub-autor">
                ${avatarPub}
                <span>Publicado por <strong>${m.nombrePublicador || "Usuario"}</strong></span>
              </div>
            </div>
          </div>`;

        window._esFavorito = esFav;
        await cargarGaleria(m.idMascota);

      } catch(err) {
        console.error("Error cargarMascota:", err);
        document.getElementById("contenidoMascota").innerHTML =
          "<p class='text-danger text-center'>Error al cargar la publicación.</p>";
      }
    }

    async function gestionarFavorito() {
      if (!accionProtegida()) return;
      try {
        const datos = new FormData();
        datos.append("idMascota", idMascota);
        datos.append("accion", window._esFavorito ? "quitar" : "añadir");
        const res   = await fetch("php/toggleFavorito.php", { method: "POST", body: datos });
        const texto = await res.text();
        if (texto.trim() === "success") {
          window._esFavorito = !window._esFavorito;
          const btn  = document.getElementById("btnFavorito");
          const icon = btn.querySelector("i");
          icon.className = window._esFavorito ? "bi bi-heart-fill" : "bi bi-heart";
          btn.title      = window._esFavorito ? "Quitar de favoritos" : "Añadir a favoritos";
        }
      } catch { alert("Error al actualizar favoritos."); }
    }

    function gestionarChat(idDestinatario) {
      if (!accionProtegida()) return;
      if (idDestinatario == _usuarioId) {
        alert("No puedes chatear contigo mismo."); return;
      }
      window.location.href = `mensajes.html?con=${idDestinatario}&mascota=${idMascota}`;
    }

    async function cargarGaleria(id) {
      try {
        const urls = [
          `php/verImagen.php?id=${id}`,
          `php/verImagen.php?id=${id}&n=2`,
          `php/verImagen.php?id=${id}&n=3`
        ];
        const checks = await Promise.all(urls.map(url =>
          fetch(url, { method: "HEAD" }).then(r => r.ok).catch(() => false)
        ));
        fotosDisponibles = urls.filter((_, i) => checks[i]);
        fotoActual       = 0;
        if (fotosDisponibles.length <= 1) return;

        document.getElementById("btnIzq").classList.remove("d-none");
        document.getElementById("btnDer").classList.remove("d-none");

        const cont = document.getElementById("fotosMiniaturas");
        cont.innerHTML = "";
        fotosDisponibles.forEach((url, i) => {
          const img = document.createElement("img");
          img.src   = url;
          img.alt   = `Foto ${i + 1}`;
          img.onerror = () => img.style.display = "none";
          if (i === 0) img.classList.add("activa");
          img.addEventListener("click", () => { fotoActual = i; actualizarFoto(i); });
          cont.appendChild(img);
        });
      } catch { /* silencioso */ }
    }

    function actualizarFoto(index) {
      document.getElementById("fotoPrincipal").src = fotosDisponibles[index];
      document.querySelectorAll(".fotos-miniaturas img").forEach((img, i) => {
        img.classList.toggle("activa", i === index);
      });
      fotoActual = index;
    }

    function cambiarFoto(dir) {
      if (!fotosDisponibles.length) return;
      fotoActual = (fotoActual + dir + fotosDisponibles.length) % fotosDisponibles.length;
      actualizarFoto(fotoActual);
    }

    inicializar().then(() => cargarMascota());
  </script>
  <script src="assets/footer-common.js"></script>
</body>
</html>
