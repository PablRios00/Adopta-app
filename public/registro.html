<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Adopciones</title>

  <!-- Bootstrap y CSS principal -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/estilos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <section class="section-central">
    <div class="card-form">
      <h3 class="titulo-principal text-center mb-3">Crear cuenta</h3>
      <p class="text-muted text-center mb-4">
        Únete a nuestra comunidad de adopciones 🐶💙
      </p>

      <form id="formRegistro" novalidate>
        <div class="mb-3">
          <label for="usuario" class="form-label">Nombre de usuario</label>
          <input type="text" id="usuario" name="usuario" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" id="correo" name="correo" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="correoConfirma" class="form-label">Confirma tu correo</label>
          <input type="email" id="correoConfirma" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="contrasenaConfirma" class="form-label">Confirma tu contraseña</label>
          <input type="password" id="contrasenaConfirma" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="text" id="telefono" name="telefono" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección</label>
          <input type="text" id="direccion" name="direccion" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-principal w-100">Registrarse</button>
        <div id="mensaje" class="text-danger text-center mt-3" style="min-height:1.5em;"></div>

        <div class="text-center mt-3">
          <small class="text-muted">¿Ya tienes cuenta?</small><br>
          <a href="login.html" class="btn btn-outline-principal w-100 mt-2">Inicia sesión</a>
        </div>
      </form>
    </div>
  </section>

  <script>
    const form = document.getElementById("formRegistro");
    const msg = document.getElementById("mensaje");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.textContent = ""; // limpia mensaje previo

      // Tomamos valores
      const usuario = document.getElementById("usuario").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const correoConf = document.getElementById("correoConfirma").value.trim();
      const pass = document.getElementById("contrasena").value.trim();
      const passConf = document.getElementById("contrasenaConfirma").value.trim();
      const tel = document.getElementById("telefono").value.trim();
      const dir = document.getElementById("direccion").value.trim();

      // 🔎 Validaciones básicas
      if (!usuario || !correo || !correoConf || !pass || !passConf || !tel || !dir) {
        msg.textContent = "Por favor, completa todos los campos.";
        return;
      }

      if (correo !== correoConf) {
        msg.textContent = "Los correos electrónicos no coinciden.";
        return;
      }

      if (pass !== passConf) {
        msg.textContent = "Las contraseñas no coinciden.";
        return;
      }

      // Si pasa todas las validaciones
      const datos = new FormData(form);
      try {
        const res = await fetch("../php/registro.php", {
          method: "POST",
          body: datos,
        });
        const texto = await res.text();

        if (texto.trim() === "success") {
          msg.classList.remove("text-danger");
          msg.classList.add("text-success");
          msg.textContent = "Registro exitoso. Redirigiendo...";
          setTimeout(() => (window.location.href = "login.html"), 1500);
        } else {
          msg.classList.remove("text-success");
          msg.classList.add("text-danger");
          msg.textContent = texto || "Ha ocurrido un error.";
        }
      } catch (err) {
        msg.classList.remove("text-success");
        msg.classList.add("text-danger");
        msg.textContent = "No se pudo conectar con el servidor.";
      }
    });
  </script>
</body>
</html>
